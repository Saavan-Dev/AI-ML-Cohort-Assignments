# Regenerates the README assignments table whenever pages change.
name: Update README

on:
  push:
    branches: [main]
    paths:
      - "app_pages/**"
      - "registry.py"
      - ".github/scripts/update_readme.py"
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: write               # needed to commit the updated README

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild README section
        run: python .github/scripts/update_readme.py

      - name: Commit README if it changed
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update assignments list"
          git push
