# ============================================================
#  DB Keepalive Workflow
#  Purpose: ping the free MySQL database on a schedule so the
#           provider doesn't pause or delete it for inactivity.
# ============================================================

name: DB Keepalive

# ------------------------------------------------------------
# WHEN does this workflow run?
# ------------------------------------------------------------
on:
  # Runs automatically on a timer (cron times are in UTC).
  # "0 3 * * *" = every day at 03:00 UTC (08:30 IST).
  schedule:
    - cron: "0 3 * * *"

  # Adds a "Run workflow" button in the Actions tab
  # so you can run it manually anytime for testing.
  workflow_dispatch:

# ------------------------------------------------------------
# SECURITY: give the workflow the minimum permission it needs.
# This job only reads the code, it never writes to the repo.
# ------------------------------------------------------------
permissions:
  contents: read

# ------------------------------------------------------------
# If a previous run is still going, don't start a second one.
# ------------------------------------------------------------
concurrency:
  group: db-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest

    # Kill the job if it hangs, so it doesn't waste time.
    timeout-minutes: 5

    steps:
      # ----------------------------------------------------
      # STEP 1: Download your repository code onto the runner
      # ----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v7

      # ----------------------------------------------------
      # STEP 2: Install Python 3.12
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ----------------------------------------------------
      # STEP 3: Install only the libraries the keepalive needs
      # (faster than installing the whole requirements.txt)
      # ----------------------------------------------------
      - name: Install dependencies
        run: pip install sqlalchemy pymysql

      # ----------------------------------------------------
      # STEP 4 (TEMPORARY): Check that DB_HOST looks correct.
      # It never prints the actual value, because logs of a
      # public repo are visible to everyone.
      # Delete this step once everything works.
      # ----------------------------------------------------
      - name: Debug DB_HOST
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          echo "Length of DB_HOST: ${#DB_HOST}"
          [[ "$DB_HOST" == *"://"* ]] && echo "WARNING: contains a scheme like mysql:// (remove it)"
          [[ "$DB_HOST" == *":"* ]] && echo "WARNING: contains a colon or port (remove it)"
          [[ "$DB_HOST" =~ [[:space:]] ]] && echo "WARNING: contains spaces or newlines (remove them)"
          getent hosts "$DB_HOST" > /dev/null && echo "DNS OK: hostname resolves" || echo "DNS FAILED: hostname does not exist"

      # ----------------------------------------------------
      # STEP 5: Run the keepalive script.
      # Secrets are passed in as environment variables.
      # GitHub automatically hides their values in logs (***).
      # ----------------------------------------------------
      - name: Ping the database
        env:
          DB_DRIVERNAME: ${{ secrets.DB_DRIVERNAME }}
          DB_USERNAME:   ${{ secrets.DB_USERNAME }}
          DB_PASSWORD:   ${{ secrets.DB_PASSWORD }}
          DB_HOST:       ${{ secrets.DB_HOST }}
          DB_PORT:       ${{ secrets.DB_PORT }}
          DB_DATABASE:   ${{ secrets.DB_DATABASE }}
        run: python db_keepalive.py
